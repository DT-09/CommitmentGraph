name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check static/app.js && node --check static/enhancements.js
      - run: docker build --tag commitmentgraph:ci .
      - run: COMMITMENTGRAPH_API_KEY=ci-test-secret PORT=8000 docker compose config -q
