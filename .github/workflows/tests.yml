name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check static/app.js && node --check static/enhancements.js && node --check static/site.js && node --input-type=module --check < 'functions/api/[[path]].js'
      - run: docker build --tag commitmentgraph:ci .
      - run: COMMITMENTGRAPH_API_KEY=ci-test-secret PORT=8000 docker compose config -q
      - run: docker run -d --name commitmentgraph-smoke -e COMMITMENTGRAPH_API_KEY=ci-test-secret -p 8000:8000 commitmentgraph:ci
      - run: for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 1; done; docker logs commitmentgraph-smoke; exit 1
      - if: always()
        run: docker rm -f commitmentgraph-smoke || true
