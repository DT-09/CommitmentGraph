services:
  commitmentgraph:
    build: .
    container_name: commitmentgraph
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      COMMITMENTGRAPH_API_KEY: ${COMMITMENTGRAPH_API_KEY:?Set COMMITMENTGRAPH_API_KEY in .env}
      DATA_DIR: /app/data
    volumes:
      - commitmentgraph_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  commitmentgraph_data:
